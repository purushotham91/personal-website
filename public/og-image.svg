<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1014"/>
      <stop offset="100%" stop-color="#161726"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#25262d" stroke-width="1" opacity="0.5">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
  </g>

  <!-- top label -->
  <text x="80" y="125" fill="#9b988f"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="22" letter-spacing="6"
        text-transform="uppercase">PURUSIRASAPALLI.COM</text>

  <!-- name -->
  <text x="80" y="290" fill="#ecebe6"
        font-family="Iowan Old Style, Palatino, Georgia, serif"
        font-size="86" font-weight="600" letter-spacing="-2">Purushotham Sirasapalli</text>

  <!-- tagline -->
  <text x="80" y="370" fill="#9bb5ff"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="32" letter-spacing="-0.5">Robotics and systems researcher · CS + Math @ Buffalo</text>

  <!-- footer line -->
  <text x="80" y="525" fill="#9b988f"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="22" letter-spacing="0.5">SKiM · Coriolis-Lite · IROS 2026 · SKiMet</text>

  <text x="80" y="565" fill="#74c191"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="22" letter-spacing="2">● OPEN TO ROLES · AVAILABLE JUNE 2026</text>
</svg>
